name: Publish to npm (manual)

# Manual fallback only. Normal releases go through release-please.yml, whose
# `publish` job runs automatically whenever a release-please release PR is
# merged (see the comment there for why this can't be a `release: published`
# trigger on releases created via GITHUB_TOKEN).
on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm publish
